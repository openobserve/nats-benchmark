[package]
name = "nats-benchmark"
version = "0.1.0"
edition = "2021"

[dependencies]
async-nats = "0.42"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hdrhistogram = "7"
humantime = "2"
humantime-serde = "1"
indicatif = "0.17"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
futures = "0.3"
bytes = "1"
async-trait = "0.1"

[[bin]]
name = "nats-benchmark"
path = "src/main.rs"
